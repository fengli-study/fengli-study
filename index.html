<style>
/* ========== 全局变量 ========== */
:root {
  --primary: #2d5016;
  --primary-light: #4a7c2a;
  --primary-dark: #1a3009;
  --accent: #f5a623;
  --bg: #f5f5f0;
  --bg-card: #ffffff;
  --bg-soft: #fafaf7;
  --text: #2c2c2c;
  --text-soft: #6b6b6b;
  --text-light: #999999;
  --border: #e8e8e3;
  --border-soft: #f0f0eb;
  --success: #4caf50;
  --danger: #e74c3c;
  --warning: #ff9800;
  --info: #2196f3;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --transition: all 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 14px; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }

/* ========== 移动端顶部 ========== */
.mobile-header {
  display: none;
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--primary);
  color: white;
  padding: 12px 16px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.menu-toggle { color: white; padding: 4px; }
.mobile-title { font-size: 16px; font-weight: 600; }
.mobile-streak {
  background: rgba(255,255,255,0.2);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
}

/* ========== 主框架 ========== */
.app-shell {
  display: flex;
  min-height: 100vh;
}

/* ========== 侧边栏 ========== */
.sidebar {
  width: 240px;
  background: var(--primary);
  color: white;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  width: 44px;
  height: 44px;
  background: var(--accent);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 2px 8px rgba(245,166,35,0.4);
}
.brand-name {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.brand-sub {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 2px;
}

.nav-list {
  padding: 12px 8px;
  flex: 1;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.85);
  margin-bottom: 2px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
.nav-item.active {
  background: rgba(255,255,255,0.15);
  color: white;
  font-weight: 500;
}
.nav-emoji {
  font-size: 16px;
  width: 20px;
  text-align: center;
}

/* ===== 自我提升子菜单（嵌套在侧边栏） ===== */
.nav-group {
  margin-bottom: 2px;
}
.nav-arrow {
  margin-left: auto;
  font-size: 10px;
  transition: transform 0.2s;
  opacity: 0.7;
}
.nav-group.expanded .nav-arrow {
  transform: rotate(90deg);
}
.nav-sub {
  display: none;
  flex-direction: column;
  margin: 2px 0 6px 0;
  padding-left: 12px;
  border-left: 1px solid rgba(255,255,255,0.12);
  margin-left: 20px;
}
.nav-group.expanded .nav-sub {
  display: flex;
}
.nav-sub-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.nav-sub-item:hover {
  background: rgba(255,255,255,0.08);
  color: white;
}
.nav-sub-item.active {
  background: rgba(255,255,255,0.15);
  color: white;
  font-weight: 500;
}
.nav-sub-item.active::before {
  content: '';
  position: absolute;
  left: -13px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 16px;
  background: var(--accent, #f5a623);
  border-radius: 2px;
}
.nav-sub-badge {
  margin-left: auto;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: white;
  font-weight: 500;
  min-width: 18px;
  text-align: center;
}
.nav-sub-item.active .nav-sub-badge {
  background: var(--accent, #f5a623);
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.footer-streak {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.08);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.streak-flame { font-size: 24px; }
.streak-num { font-size: 18px; font-weight: 600; }
.streak-label { font-size: 11px; opacity: 0.7; }
.footer-date {
  font-size: 11px;
  opacity: 0.6;
  text-align: center;
}

/* ========== 主内容区 ========== */
.main-content {
  flex: 1;
  padding: 24px 32px 64px;
  max-width: 100%;
  min-width: 0;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}
.page-title {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
}
.page-date {
  font-size: 13px;
  color: var(--text-soft);
  margin-top: 4px;
}
.page-actions { display: flex; gap: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-light); }
.btn-outline {
  background: white;
  color: var(--text);
  border-color: var(--border);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-ghost { color: var(--text-soft); padding: 6px 10px; }
.btn-ghost:hover { background: var(--bg-soft); color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: #fef5f5; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ========== 卡片 ========== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  border: 1px solid var(--border-soft);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-soft);
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.card-sub {
  font-size: 12px;
  color: var(--text-soft);
  margin-top: 2px;
}

/* ========== 任务清单 ========== */
.task-section { margin-bottom: 20px; }
.task-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.task-section-title .badge {
  background: var(--bg-soft);
  color: var(--text-soft);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: var(--transition);
}
.task-item:hover { border-color: var(--primary-light); }
.task-item.done { opacity: 0.5; }
.task-item.done .task-text { text-decoration: line-through; }
.task-checkbox {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: var(--transition);
}
.task-item.done .task-checkbox {
  background: var(--success);
  border-color: var(--success);
  color: white;
}
.task-content { flex: 1; min-width: 0; }
.task-text { font-size: 14px; color: var(--text); }
.task-meta {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 2px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.task-tag {
  background: var(--bg-soft);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
}
.task-actions { display: flex; gap: 4px; }

/* 系统任务（自我提升）特殊样式 */
.task-item.task-system {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-soft) 100%);
  border-left: 3px solid var(--primary-light);
}

  snapshotDailyCompletion(date, tasks, checkedIn) {
    const all = this.get('DAILY_COMPLETION', []);
    const idx = all.findIndex(c => c.date === date);
    const snap = {
      date,
      checkedIn,
      tasks: tasks.map(t => ({ type: t.type, text: t.text, done: t.done })),
      updatedAt: new Date().toISOString(),
    };
    if (idx >= 0) all[idx] = snap; else all.push(snap);
    this.set('DAILY_COMPLETION', all);
  },

  // 打卡
  checkin() {
    const today = new Date().toISOString().slice(0, 10);
    const streak = this.get('STREAK');
    if (streak.lastDate === today) return streak;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (streak.lastDate === yesterday) {
      streak.count += 1;
    } else {
      streak.count = 1;
    }
    streak.lastDate = today;
    streak.longest = Math.max(streak.longest || 0, streak.count);
    this.set('STREAK', streak);
    // 记录到 checkins
    const checkins = this.get('CHECKINS', []);
    if (!checkins.find(c => c.date === today)) {
      checkins.push({ date: today, time: new Date().toISOString() });
      this.set('CHECKINS', checkins);
    }
    return streak;

const App = {
  state: {
    currentTab: 'plan',
    planFilter: 'all', // all | todo | done
  },

  init() {
    // 清理历史脏数据：v18 之前的 bug 会在 VIDEO_WATCHED 留下 "undefined" key
    const watched = DB.get('VIDEO_WATCHED', {});
    const keys = Object.keys(watched);
    if (keys.some(k => !k || k === 'undefined' || k === 'null')) {
      const cleaned = {};
      keys.forEach(k => {
        if (k && k !== 'undefined' && k !== 'null') cleaned[k] = watched[k];
      });
      DB.set('VIDEO_WATCHED', cleaned);
    }
    this.bindNav();
    this.bindHeader();
    this.bindModal();
    this.renderStreak();
    this.renderDate();
    // 支持从 sessionStorage / hash 读取目标 tab
    const target = sessionStorage.getItem('targetTab');
    if (target) {
      this.state.currentTab = target;
      sessionStorage.removeItem('targetTab');
    } else if (location.hash) {
      this.state.currentTab = location.hash.slice(1);
    }
    this.renderTab();
  },

  bindHeader() {
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
      const bd = document.createElement('div');
      bd.className = 'sidebar-backdrop show';
      bd.id = 'sidebarBackdrop';
      document.body.appendChild(bd);
      bd.addEventListener('click', () => this.closeSidebar());
    });
  },
  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop')?.remove();
  },

  bindNav() {
    // 主导航点击
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const tab = item.dataset.tab;
        // 如果点击的是"自我提升"项，且子菜单已展开且不是空白区域，切换展开状态
        if (tab === 'study') {
          const group = item.closest('.nav-group');
          if (group) {
            // 如果子菜单已展开，第二次点击则收起
            if (group.classList.contains('expanded') && !e.target.classList.contains('nav-arrow')) {
              // 已经是打开状态且点击的是文字部分 → 展开/收起切换
              group.classList.toggle('expanded');
              this.switchTab(tab);
              this.closeSidebar();
              return;
            }
            group.classList.add('expanded');
          }
        }
        this.switchTab(tab);
        this.closeSidebar();
      });
    });

    // 自我提升子菜单点击
    document.querySelectorAll('[data-study-sub]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const sub = item.dataset.studySub;
        sessionStorage.setItem('study_sub', sub);
        // 始终调用 switchTab 切换到 study tab（保证状态一致）
        this.switchTab('study');
        this.closeSidebar();
      });
    });
  },

  bindModal() {
    document.getElementById('modalClose').addEventListener('click', () => Modal.close());
    document.getElementById('modalBackdrop').addEventListener('click', () => Modal.close());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') Modal.close();
    });
  },

  switchTab(tab) {
    this.state.currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
    // 如果切到 study，展开子菜单并高亮当前子项
    if (tab === 'study') {
      const group = document.querySelector('[data-nav-group="study"]');
      group?.classList.add('expanded');
      const sub = sessionStorage.getItem('study_sub') || 'overview';
      document.querySelectorAll('.nav-sub-item').forEach(t => t.classList.toggle('active', t.dataset.studySub === sub));
    } else {
      // 切到其它 tab 时收起子菜单
      const group = document.querySelector('[data-nav-group="study"]');
      group?.classList.remove('expanded');
      document.querySelectorAll('.nav-sub-item').forEach(t => t.classList.remove('active'));
    }
    this.renderTab();
  },

  renderStreak() {
    const s = DB.get('STREAK');
    document.getElementById('streakNum').textContent = s.count;
    document.getElementById('mobileStreak').textContent = `🔥 ${s.count}`;
  },

  renderDate() {
    const d = new Date();
    document.getElementById('pageDate').textContent = `${DB.fmtDate(d)} · ${DB.fmtWeekday(d)}`;
    document.getElementById('footerDate').textContent = DB.fmtDate(d);
  },

  renderTab() {
    const tab = this.state.currentTab;
    const titles = {
      plan: '每日计划',
      study: '自我提升',
      files: '飞书文件',
      stats: '账号数据',
      settings: '设置',
    };
    document.getElementById('pageTitle').textContent = titles[tab] || tab;
    const actions = document.getElementById('pageActions');
    actions.innerHTML = '';

    const renderers = {
      plan: () => renderPlan(),
      study: () => renderStudy(),
      files: () => renderFiles(),
      stats: () => renderStats(),
      settings: () => renderSettings(),
    };
    document.getElementById('tabContent').innerHTML = renderers[tab] ? renderers[tab]() : '<div class="empty-state"><div class="empty-icon">🚧</div><div>该模块开发中</div></div>';
    bindTabEvents(tab);
  },
};

// ===== 模块：每日计划 =====
function renderPlan() {
  const userTasks = DB.get('TASKS', []);
  const systemTasks = getSystemTasks();
  const allTasks = [...systemTasks, ...userTasks];
  const todo = allTasks.filter(t => !t.done);
  const done = allTasks.filter(t => t.done);
  const total = allTasks.length;
  const doneCount = done.length;
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  const allDone = pct === 100 && total > 0;

  // 如果今日计划全部完成且今天还没打卡，自动打卡
  const today = DB.today();
  const checkins = DB.get('CHECKINS', []);
  const alreadyCheckedIn = checkins.some(c => c.date === today);
  if (allDone && !alreadyCheckedIn) {
    DB.checkin();
    snapshotTodayCompletion();
    App.renderStreak();
  }

  // 自我提升完成度（系统任务总数会随新增模块变化）
  const sysDone = systemTasks.filter(t => t.done).length;
  const sysTotal = systemTasks.length;

  const filterHtml = `
    <div class="tabs">
      <div class="tab ${App.state.planFilter==='all'?'active':''}" data-filter="all">全部 (${total})</div>
      <div class="tab ${App.state.planFilter==='todo'?'active':''}" data-filter="todo">待办 (${todo.length})</div>
      <div class="tab ${App.state.planFilter==='done'?'active':''}" data-filter="done">已完成 (${done.length})</div>
    </div>`;

  const progressHtml = `
    <div class="progress-wrap">
      <div class="progress-header">
        <div class="progress-label">今日完成度</div>
        <div class="progress-num">${doneCount} / ${total} · ${pct}%</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-tips">${allDone ? '🎉 全部完成！已自动打卡' : pct >= 60 ? `💪 自我提升 ${sysDone}/${sysTotal}，再坚持一下` : `☀️ 自我提升 ${sysDone}/${sysTotal}，开始今天的工作吧`}</div>
    </div>`;

  const checkinBtnCls = allDone ? 'btn-primary' : 'btn-outline';
  const checkinBtnText = allDone ? '🎉 今日已打卡' : (alreadyCheckedIn ? '✅ 已打卡' : `✅ 今日打卡${todo.length ? `（剩${todo.length}项）` : ''}`);
  const addBtn = `<button class="btn btn-primary" id="addTaskBtn">+ 添加任务</button>
    <button class="btn ${checkinBtnCls}" id="checkinBtn">${checkinBtnText}</button>`;
  document.getElementById('pageActions').innerHTML = addBtn;

  const showTasks = App.state.planFilter === 'all' ? allTasks
    : App.state.planFilter === 'todo' ? todo : done;

  let html = filterHtml + progressHtml;
  if (showTasks.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">📝</div>
      <div class="empty-text">还没有任务，点击右上角添加吧</div>
    </div>`;
  } else {
    // 分组：系统今日 / 用户今日 / 之后
    const todaySystem = showTasks.filter(t => t.system);
    const todayUser = showTasks.filter(t => !t.system && (t.date === DB.today() || !t.date));
    const futureTasks = showTasks.filter(t => !t.system && t.date && t.date > DB.today());

    if (todaySystem.length) {
      html += `<div class="task-section">
        <div class="task-section-title">🌟 自我提升 <span class="badge">${todaySystem.length}</span></div>
        ${todaySystem.map(t => taskItemHtml(t)).join('')}
      </div>`;
    }
    if (todayUser.length) {
      html += `<div class="task-section">
        <div class="task-section-title">📅 今日任务 <span class="badge">${todayUser.length}</span></div>
        ${todayUser.map(t => taskItemHtml(t)).join('')}
      </div>`;
    }
    if (futureTasks.length) {
      html += `<div class="task-section">
        <div class="task-section-title">📆 之后任务 <span class="badge">${futureTasks.length}</span></div>
        ${futureTasks.map(t => taskItemHtml(t)).join('')}
      </div>`;
    }
    if (!todaySystem.length && !todayUser.length && !futureTasks.length) {
      html += `<div class="empty-state">
        <div class="empty-icon">✨</div>
        <div class="empty-text">筛选结果为空</div>
      </div>`;
    }
  }
  return html;
}

function taskItemHtml(t) {
  const systemCls = t.system ? 'task-system' : '';
  const linkHint = t.system ? '<span class="task-link-hint">🔗 同步到自我提升</span>' : '';
  return `<div class="task-item ${t.done?'done':''} ${systemCls}" data-id="${t.id}">
    <div class="task-checkbox" data-action="toggle">${t.done?'✓':''}</div>
    <div class="task-content">
      <div class="task-text">${escapeHtml(t.text)}</div>
      ${(t.date || t.tag || linkHint) ? `<div class="task-meta">
        ${t.date ? `<span class="task-tag">📅 ${t.date}</span>` : ''}
        ${t.tag ? `<span class="task-tag">${escapeHtml(t.tag)}</span>` : ''}
        ${linkHint}
      </div>` : ''}
    </div>
    <div class="task-actions">
      ${t.system ? '' : '<button class="btn btn-ghost btn-sm" data-action="del">删除</button>'}
    </div>
  </div>`;
}

function bindTabEvents(tab) {
  if (tab === 'plan') {
    document.querySelectorAll('[data-filter]').forEach(el => {
      el.addEventListener('click', () => {
        App.state.planFilter = el.dataset.filter;
        App.renderTab();
      });
    });
    document.getElementById('addTaskBtn')?.addEventListener('click', () => openAddTask());
    document.getElementById('checkinBtn')?.addEventListener('click', () => doCheckin());
    document.querySelectorAll('.task-item').forEach(el => {
      const id = el.dataset.id;
      const toggleEl = el.querySelector('[data-action="toggle"]');
      const delEl = el.querySelector('[data-action="del"]');
      toggleEl?.addEventListener('click', () => toggleTask(id));
      delEl?.addEventListener('click', () => deleteTask(id));
    });
  }
  if (tab === 'study') bindStudyEvents();
  if (tab === 'files') bindFileEvents();
  if (tab === 'stats') bindStatsEvents();
  if (tab === 'settings') bindSettingsEvents();
}

function openAddTask() {
  const html = `
    <div class="form-group">
      <label class="form-label">任务内容</label>
      <input class="form-input" id="taskText" placeholder="例如：完成选题会脚本">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">日期（可选）</label>
        <input class="form-input" id="taskDate" type="date" value="${DB.today()}">
      </div>
      <div class="form-group">
        <label class="form-label">标签（可选）</label>
        <input class="form-input" id="taskTag" placeholder="工作/学习/...">
      </div>
    </div>
    <div class="flex gap-1" style="justify-content: flex-end;">
      <button class="btn btn-outline" onclick="Modal.close()">取消</button>
      <button class="btn btn-primary" id="saveTaskBtn">保存</button>
    </div>
  `;
  Modal.open('添加任务', html);
  document.getElementById('saveTaskBtn').addEventListener('click', () => {
    const text = document.getElementById('taskText').value.trim();
    if (!text) { toast('请输入任务内容'); return; }
    const date = document.getElementById('taskDate').value;
    const tag = document.getElementById('taskTag').value.trim();
    const tasks = DB.get('TASKS', []);
    tasks.push({ id: DB.uid(), text, date, tag, done: false, createdAt: Date.now() });
    DB.set('TASKS', tasks);
    Modal.close();
    toast('✓ 已添加');
    App.renderTab();
  });
}

function toggleTask(id) {
  const systemTask = DAILY_SYSTEM_TASKS.find(t => t.id === id);
  if (systemTask) {
    const tasks = getSystemTasks();
    const t = tasks.find(x => x.id === id);
    toggleSystemTask(systemTask.type, !t.done);
    toast(!t.done ? '✓ 自我提升完成一项' : '已取消');
    App.renderTab();
    return;
  }
  const tasks = DB.get('TASKS', []);
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    DB.set('TASKS', tasks);
    if (t.done) toast('✓ 完成一项任务');
    App.renderTab();
  }
}
function deleteTask(id) {
  if (DAILY_SYSTEM_TASKS.some(t => t.id === id)) {
    toast('系统任务不能删除');
    return;
  }
  if (!confirm('确定删除？')) return;
  const tasks = DB.get('TASKS', []).filter(x => x.id !== id);
  DB.set('TASKS', tasks);
  toast('已删除');
  App.renderTab();
}
function doCheckin() {
  const today = DB.today();
  const checkins = DB.get('CHECKINS', []);
  if (checkins.some(c => c.date === today)) {
    toast('✓ 今天已经打过卡了');
    return;
  }
  const systemTasks = getSystemTasks();
  const userTasks = DB.get('TASKS', []).filter(t => t.date === today || !t.date);
  const allTasks = [...systemTasks, ...userTasks];
  const todo = allTasks.filter(t => !t.done);
  if (todo.length > 0) {
    if (!confirm(`还有 ${todo.length} 项未完成，确定要打卡吗？`)) return;
  }
  const s = DB.checkin();
  snapshotTodayCompletion();
  toast(`🔥 打卡成功！连续 ${s.count} 天`);
  App.renderStreak();
  App.renderTab();
}

// ===== 自动评估学习阶段 =====
// 返回 null 表示无需调整（尊重用户手动设置）；返回数字表示建议的阶段
function assessStage(data, type) {
  // 如果用户手动设置过阶段，尊重用户选择
  if (data.manualStage) return null;

  const notes = data.notes || [];
  const scores = data.quizScores || [];
  const noteCount = notes.length;
  const quizCount = scores.length;
  const correctCount = scores.filter(q => q.correct).length;
  const accuracy = quizCount > 0 ? correctCount / quizCount : 0;

  // 品牌认知门槛稍低（内容偏娱乐），金融知识门槛稍高，管理知识适中
  const thresholds = type === 'brand'
    ? { adv: { notes: 3, quiz: 3, acc: 0.5 }, deep: { notes: 8, quiz: 8, acc: 0.7 } }
    : type === 'management'
      ? { adv: { notes: 3, quiz: 3, acc: 0.5 }, deep: { notes: 8, quiz: 8, acc: 0.7 } }
      : { adv: { notes: 4, quiz: 4, acc: 0.55 }, deep: { notes: 10, quiz: 10, acc: 0.75 } };

  if (noteCount >= thresholds.deep.notes && quizCount >= thresholds.deep.quiz && accuracy >= thresholds.deep.acc) {
    return 2;
  }
  if (noteCount >= thresholds.adv.notes && quizCount >= thresholds.adv.quiz && accuracy >= thresholds.adv.acc) {
    return 1;
  }
  // 不达标 → 建议基础阶段
  return 0;
}

// ===== 获取推荐视频：优先当前阶段，带少量下阶段预览 =====
function getRecommendedVids(pool, stage) {
  // 分组
  const current = pool.filter(v => v.stage === stage);
  const next = pool.filter(v => v.stage === stage + 1);
  const other = pool.filter(v => v.stage !== stage && v.stage !== stage + 1);
  // 打乱各组内部
  const shuffled = [...shuffle(current), ...shuffle(next), ...shuffle(other)];
  // 去重（按URL）
  const seen = new Set();
  const result = [];
  for (const v of shuffled) {
    const key = v.url;
    if (!seen.has(key)) { seen.add(key); result.push(v); }
    if (result.length >= 3) break;
  }
  return result;
}

// 获取包含用户添加博主视频的完整推荐列表
function getRecommendedVidsWithBloggers(pool, stage, type) {
  const base = getRecommendedVids(pool, stage);
  const bloggers = getStudyBloggers(type);
  // 为用户添加的博主生成虚拟视频条目
  const bloggerVids = bloggers.map(b => ({
    title: `${b.name}：${b.note || '关注博主获取最新内容'}`,
    url: b.url,
    author: b.name,
    platform: b.platform || '抖音',
    desc: b.note || '',
    stage: stage,
  }));
  // 合并，用户博主放前面
  const all = [...bloggerVids, ...base];
  const seen = new Set();
  const result = [];
  for (const v of all) {
    const key = v.url;
    if (!seen.has(key)) { seen.add(key); result.push(v); }
    if (result.length >= 3) break;
  }
  return result;
}

function renderStudyCalendar() {
  const checkins = DB.get('CHECKINS', []);
  const completions = DB.get('DAILY_COMPLETION', []);
  const today = DB.today();
  const systemTasks = getSystemTasks();
  const totalTasks = systemTasks.length || 5;
  const todayDate = new Date();
  // 当前显示的月份（默认本月）
  if (!renderStudyCalendar._monthKey) {
    renderStudyCalendar._monthKey = `${todayDate.getFullYear()}-${todayDate.getMonth()}`;
  }
  const [y, m] = renderStudyCalendar._monthKey.split('-').map(Number);

  // 当月所有天
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  // 起头补齐（让第一天对齐到周一列）
  const startDow = (first.getDay() + 6) % 7; // 周一=0
  // 末尾补齐
  const endDow = (last.getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let day = 1; day <= last.getDate(); day++) {
    const d = new Date(y, m, day);
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds === today;
    let snap;
    if (isToday) {
      snap = { checkedIn: checkins.some(c => c.date === ds), tasks: systemTasks };
    } else {
      snap = completions.find(c => c.date === ds) || { checkedIn: checkins.some(c => c.date === ds), tasks: [] };
    }
    const taskDone = (snap.tasks || []).map(t => !!t.done);
    while (taskDone.length < totalTasks) taskDone.push(false);
    cells.push({
      date: ds,
      day,
      isToday,
      checkedIn: !!snap.checkedIn,
      taskDone,
    });
  }
  while (cells.length % 7 !== 0) cells.push(null);

  // 月份总计
  const monthCheckinCount = cells.filter(c => c && c.checkedIn).length;
  const monthActive = cells.filter(c => c).length;

  const monthLabel = `${y} 年 ${m + 1} 月`;
  // 不限制月份浏览：可以一直往前翻历史，也可以预览未来月份做排期
  const canPrev = true;
  const canNext = true;

  return `
    <div class="cal-toolbar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <button class="btn btn-outline btn-sm" data-cal-action="prev-month" ${canPrev ? '' : 'disabled'}>‹ 上月</button>
      <div style="font-weight:600;color:var(--primary);">${monthLabel}</div>
      <button class="btn btn-outline btn-sm" data-cal-action="next-month" ${canNext ? '' : 'disabled style="opacity:0.4;"'}>下月 ›</button>
    </div>
    <div class="text-soft" style="font-size:11px;margin-bottom:8px;">本月打卡 ${monthCheckinCount} / ${monthActive} 天 · 点击日期查看详情</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
      ${['一','二','三','四','五','六','日'].map(w => `<div style="font-size:10px;color:var(--text-soft);padding:4px 0;">${w}</div>`).join('')}
      ${cells.map(c => c ? renderDayRing(c) : '<div></div>').join('')}
    </div>`;
}

function renderDayRing(d) {
  const total = d.taskDone.length || 5;
  const done = d.taskDone.filter(Boolean).length;
  const segmentDeg = 360 / total;
  const gap = 6; // 扇形之间的间隔度数
  let conic = '';
  for (let i = 0; i < total; i++) {
    const start = i * segmentDeg;
    const end = start + segmentDeg - gap;
    const color = d.taskDone[i] ? 'var(--success)' : '#e6e6e0';
    conic += `${color} ${start}deg ${end}deg${i < total - 1 ? ', ' : ''}`;
  }
  const completed = done === total;
  const borderColor = d.isToday ? 'var(--primary)' : (completed ? 'var(--success)' : 'transparent');
  return `
    <div style="text-align:center;width:42px;cursor:pointer;" data-cal-date="${d.date}" data-cal-action="detail">
      <div style="font-size:10px;color:${d.isToday ? 'var(--primary)' : 'var(--text-soft)'};font-weight:${d.isToday ? '600' : 'normal'};">${d.day}日</div>
      <div style="position:relative;width:36px;height:36px;margin:4px auto;border-radius:50%;background:conic-gradient(${conic});border:2px solid ${borderColor};box-shadow:inset 0 0 0 0 transparent;">
        <div style="position:absolute;inset:5px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:${completed ? 'var(--success)' : 'var(--text-soft)'};">${done}/${total}</div>
      </div>
    </div>`;
}

// 点击日历某一天，弹出当日完成详情
function showDayDetail(date) {
  const today = DB.today();
  const isToday = date === today;
  const completions = DB.get('DAILY_COMPLETION', []);
  const checkins = DB.get('CHECKINS', []);
  const snap = isToday
    ? { checkedIn: checkins.some(c => c.date === date), tasks: getSystemTasks() }
    : (completions.find(c => c.date === date) || { checkedIn: checkins.some(c => c.date === date), tasks: [] });

  const tasks = snap.tasks || [];
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const dateObj = new Date(date + 'T00:00:00');
  const fmtDate = `${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日 · ${DB.fmtWeekday(dateObj)}`;
  const statusText = done === total && total > 0 ? '🎉 全部完成' : done > 0 ? `已完成 ${done}/${total}` : '未开始';

  const html = `
    <div class="text-soft" style="font-size:13px;margin-bottom:12px;">${fmtDate} · ${statusText}${snap.checkedIn ? ' · ✅ 已打卡' : ''}</div>
    ${total === 0 ? `<div class="empty-text">当日没有详细记录</div>` : `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${tasks.map(t => `
          <div class="task-item ${t.done ? 'done' : ''}" style="margin:0;">
            <div class="task-checkbox" style="${t.done ? 'background:var(--success);border-color:var(--success);color:white;' : ''}">${t.done ? '✓' : ''}</div>
            <div class="task-content">
              <div class="task-text">${escapeHtml(t.text)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `}
    <div class="text-soft mt-2" style="font-size:11px;">点击任务可以在每日计划里继续操作</div>
    <div class="flex gap-1 mt-2" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="Modal.close()">关闭</button>
      ${isToday ? '<button class="btn btn-primary" id="goPlanBtn">📋 去每日计划</button>' : ''}
    </div>
  `;
  Modal.open(`${date} 完成详情`, html);
  document.getElementById('goPlanBtn')?.addEventListener('click', () => {
    Modal.close();
    location.hash = '#plan';
  });
}

function isThisWeek(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay());
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  return d >= start && d < end;
}

function bindStudyEvents() {
  // 当前激活子标签的事件（侧边栏 [data-study-sub] 已在 bindNav 中处理）
  const activeSub = sessionStorage.getItem('study_sub') || 'overview';
  bindStudySubEvents(activeSub);

  document.getElementById('resetStudyBtn')?.addEventListener('click', () => {
    if (!confirm('重置今日所有自我提升进度？')) return;
    const study = DB.get('STUDY');
    const today = DB.today();
    Object.values(study.english.items).forEach(it => it.current = 0);
    study.fashion.current = 0;
    study.interview.current = 0;
    study.brand.current = 0;
    study.finance.current = 0;
    study.management.current = 0;
    // 清除今日历史记录，确保每日计划中的系统任务同步显示为未完成
    study.fashion.history = study.fashion.history.filter(h => h.date !== today);
    study.interview.history = study.interview.history.filter(h => h.date !== today);
    study.brand.history = study.brand.history.filter(h => h.date !== today);
    study.finance.history = study.finance.history.filter(h => h.date !== today);
    study.management.history = study.management.history.filter(h => h.date !== today);
    DB.set('STUDY', study);
    toast('已重置');
    App.renderTab();
  });
}

// 构建 renderStudySub 需要的上下文
function buildStudyContext() {
  const study = DB.get('STUDY');
  const bloggers = DB.get('BLOGGERS', []);
  const interviews = DB.get('INTERVIEWS', []);
  const insights = DB.get('INSIGHTS', []);
  const activeBloggers = bloggers.filter(b => b.active);
  const eng = study.english;
  const engTotal = Object.values(eng.items).reduce((s, it) => s + it.current, 0);
  const engTarget = Object.values(eng.items).reduce((s, it) => s + it.target, 0);
  const engPct = Math.min(100, (engTotal / Math.max(1, engTarget)) * 100);
  const fashionVideos = DB.get('VIDEOS', []).filter(v =>
    v.category === '美妆穿搭' || (v.tags || []).some(t => /穿搭|美妆|化妆|时尚/.test(t)) || activeBloggers.some(b => v.title.includes(b.name))
  );
  const interviewVideos = DB.get('VIDEOS', []).filter(v =>
    v.category === '深度访谈' || (v.tags || []).some(t => /访谈|鲁豫|罗永浩|董宇辉|罗翔|人物|观点/.test(t)) || interviews.some(p => v.title.includes(p.name))
  );
  const brandVideos = DB.get('VIDEOS', []).filter(v =>
    v.category === '品牌认知' || (v.tags || []).some(t => /品牌|奢侈|时尚|AHALOLO/.test(t))
  );
  const financeVideos = DB.get('VIDEOS', []).filter(v =>
    v.category === '金融知识' || (v.tags || []).some(t => /金融|理财|投资|股票|基金|经济/.test(t))
  );
  const managementVideos = DB.get('VIDEOS', []).filter(v =>
    v.category === '管理知识' || (v.tags || []).some(t => /管理|商业|创业|战略|刘润|所长林超/.test(t))
  );
  return { study, eng, engPct, engTotal, engTarget, activeBloggers, bloggers, interviews, fashionVideos, interviewVideos, brandVideos, financeVideos, managementVideos, insights };
}

// 按子标签绑定事件
function bindStudySubEvents(sub) {
  if (sub === 'overview') {
    // 概览卡片点击 → 跳到对应子模块
    document.querySelectorAll('[data-entry-sub]').forEach(card => {
      card.addEventListener('click', () => {
        const target = card.dataset.entrySub;
        sessionStorage.setItem('study_sub', target);
        App.renderTab();
      });
      // hover 反馈
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-2px)';
        card.style.boxShadow = '0 4px 12px rgba(0,0,0,0.08)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
        card.style.boxShadow = '';
      });
    });
  }
  if (sub === 'english') {
    document.getElementById('addEnglishBtn')?.addEventListener('click', openEnglishRecord);
  }
  if (sub === 'fashion') {
    document.getElementById('addFashionBtn')?.addEventListener('click', openFashionRecord);
    document.getElementById('manageBloggersBtn')?.addEventListener('click', manageBloggers);
    document.getElementById('searchFashionBtn')?.addEventListener('click', () => searchStudyVideos('美妆穿搭'));
    document.getElementById('searchFashionBtnEmpty')?.addEventListener('click', () => searchStudyVideos('美妆穿搭'));
    document.querySelectorAll('[data-fashion-action="add"]').forEach(btn => {
      btn.addEventListener('click', openFashionRecord);
    });
  }
  if (sub === 'interview') {
    document.getElementById('addInterviewBtn')?.addEventListener('click', openInterviewRecord);
    document.getElementById('manageInterviewsBtn')?.addEventListener('click', manageInterviews);
    document.getElementById('searchInterviewBtn')?.addEventListener('click', () => searchStudyVideos('深度访谈'));
    document.getElementById('searchInterviewBtnEmpty')?.addEventListener('click', () => searchStudyVideos('深度访谈'));
    document.querySelectorAll('[data-interview-action="add"]').forEach(btn => {
      btn.addEventListener('click', openInterviewRecord);
    });
  }
  if (sub === 'brand') {
    document.querySelectorAll('[data-brand-action="record"]').forEach(btn => btn.addEventListener('click', openBrandRecord));
    document.querySelectorAll('[data-brand-action="quiz"]').forEach(btn => btn.addEventListener('click', () => openBrandQuiz()));

    document.querySelectorAll('[data-brand-stage]').forEach(el => el.addEventListener('click', () => {
      setStudyStage('brand', parseInt(el.dataset.brandStage));
    }));
    document.getElementById('searchBrandBtn')?.addEventListener('click', () => searchStudyVideos('品牌认知'));

  if (sub === 'finance') {
    document.querySelectorAll('[data-finance-action="record"]').forEach(btn => btn.addEventListener('click', openFinanceRecord));
    document.querySelectorAll('[data-finance-action="quiz"]').forEach(btn => btn.addEventListener('click', () => openFinanceQuiz()));

    document.querySelectorAll('[data-finance-action="bloggers"]').forEach(btn => btn.addEventListener('click', () => manageStudyBloggers('finance')));
    document.querySelectorAll('[data-finance-stage]').forEach(el => el.addEventListener('click', () => {
      setStudyStage('finance', parseInt(el.dataset.financeStage));
    }));
    document.getElementById('searchFinanceBtn')?.addEventListener('click', () => searchStudyVideos('金融知识'));
  }
  if (sub === 'management') {
    document.querySelectorAll('[data-management-action="record"]').forEach(btn => btn.addEventListener('click', openManagementRecord));
    document.querySelectorAll('[data-management-action="quiz"]').forEach(btn => btn.addEventListener('click', () => openManagementQuiz()));
    document.querySelectorAll('[data-management-action="notes"]').forEach(btn => btn.addEventListener('click', viewManagementNotes));
    document.querySelectorAll('[data-management-action="bloggers"]').forEach(btn => btn.addEventListener('click', () => manageStudyBloggers('management')));
    document.querySelectorAll('[data-management-stage]').forEach(el => el.addEventListener('click', () => {
      setStudyStage('management', parseInt(el.dataset.managementStage));
    }));
  }
  if (sub === 'calendar') {
    document.querySelectorAll('[data-cal-action="detail"]').forEach(el => {
      el.addEventListener('click', () => showDayDetail(el.dataset.calDate));
    });
    document.querySelectorAll('[data-cal-action="prev-month"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = renderStudyCalendar._monthKey || '';
        const [yy, mm] = key.split('-').map(Number);
        const np = mm === 0 ? `${yy - 1}-11` : `${yy}-${mm - 1}`;
        renderStudyCalendar._monthKey = np;
        App.renderTab();
      });
    });
    document.querySelectorAll('[data-cal-action="next-month"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = renderStudyCalendar._monthKey || '';
        const [yy, mm] = key.split('-').map(Number);
        const np = mm === 11 ? `${yy + 1}-0` : `${yy}-${mm + 1}`;
        renderStudyCalendar._monthKey = np;
        App.renderTab();
      });
    });
  }
  if (sub === 'insights') {
    document.querySelectorAll('[data-insight-action="del"]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.closest('.video-card').dataset.insightId;
        if (!confirm('删除？')) return;
        DB.set('INSIGHTS', DB.get('INSIGHTS', []).filter(x => x.id !== id));
        toast('已删除');
        App.renderTab();
      });
    });
  }

  // 通用：视频操作（所有子标签都可能包含视频）
  document.querySelectorAll('[data-study-video-action="watched"]').forEach(el => {
    el.addEventListener('click', () => {
      const card = el.closest('.video-card');
      const vid = card.dataset.id;
      const watched = DB.get('VIDEO_WATCHED', {});
      if (watched[vid]) { delete watched[vid]; } else { watched[vid] = DB.today(); }
      DB.set('VIDEO_WATCHED', watched);
      App.renderTab();
    });
  });
  document.querySelectorAll('[data-study-video-action="open"]').forEach(el => {
    el.addEventListener('click', () => {
      const card = el.closest('.video-card');
      const vid = card.dataset.id;
      const watched = DB.get('VIDEO_WATCHED', {});
      if (!watched[vid]) { watched[vid] = DB.today(); DB.set('VIDEO_WATCHED', watched); App.renderTab(); }
    });
  });
  document.querySelectorAll('[data-study-video-action="insight"]').forEach(el => {
    el.addEventListener('click', () => {
      const card = el.closest('.video-card');
      const vid = card.dataset.id;
      // 先尝试从内置常量查找，再从用户添加的VIDEOS中查找
      let v = BRAND_VIDEOS.find(x => (x.id || x.url) === vid)
          || FINANCE_VIDEOS.find(x => (x.id || x.url) === vid)
          || MANAGEMENT_VIDEOS.find(x => (x.id || x.url) === vid)
          || FASHION_VIDEOS.find(x => (x.id || x.url) === vid)
          || INTERVIEW_VIDEOS.find(x => (x.id || x.url) === vid)
          || DB.get('VIDEOS', []).find(x => x.id === vid);

async function searchStudyVideos(category) {
  const bloggers = DB.get('BLOGGERS', []).filter(b => b.active);
  const people = DB.get('INTERVIEWS', []);
  let items;
  let tags;
  switch (category) {
    case '美妆穿搭':
      items = generateFashionVideos(bloggers, 3);
      tags = ['美妆', '穿搭'];
      break;
    case '深度访谈':
      items = generateInterviewVideos(people, 3);
      tags = ['访谈', '人物'];
      break;
    case '品牌认知':
      items = generateBrandVideos(3);
      tags = ['品牌', '营销'];
      break;
    case '金融知识':
      items = generateFinanceVideos(3);
      tags = ['金融', '理财'];
      break;
    default:
      items = [];
      tags = [];
  }
  items.forEach(v => {
    v.id = DB.uid();
    v.date = DB.today();
    v.category = category;
    v.tags = tags;
  });
  const videos = DB.get('VIDEOS', []);
  const existingUrls = new Set(videos.map(v => v.url));
  const newItems = items.filter(v => !existingUrls.has(v.url));
  videos.unshift(...newItems);
  DB.set('VIDEOS', videos);
  const platforms = [...new Set(newItems.map(v => v.platform))].join('+');
  toast(`✓ 已更新 ${newItems.length} 条${category}视频 (${platforms})`);
  App.renderTab();
}

// 品牌认知视频：按当前学习阶段优先
function generateBrandVideos(n) {
  const study = DB.get('STUDY');
  const stage = (study.brand || {}).stage || 0;
  const pool = BRAND_VIDEOS.slice();
  // 优先当前阶段的视频
  pool.sort((a, b) => {
    if (a.stage === stage && b.stage !== stage) return -1;
    if (b.stage === stage && a.stage !== stage) return 1;
    return 0;
  });
  return shuffle(pool).slice(0, n).map(v => ({ ...v }));
}

// 金融知识视频：按当前学习阶段优先

];

const DAILY_SYSTEM_TASKS = DAILY_SYSTEM_TASKS_BASE.map(t => ({
  ...t,
  get text() { return t.getText ? t.getText(getDailyTargets()) : t.text; }
}));

// 根据自我提升进度，生成今日系统任务的完成状态
function getSystemTasks() {
  const study = DB.get('STUDY');
  const today = DB.today();
  const targets = getDailyTargets();
  return DAILY_SYSTEM_TASKS.map(st => {
    let done = false;
    switch (st.type) {
      case 'english_words': done = (study.english.items.words.current >= targets.words); break;
      case 'english_listening': done = (study.english.items.listening.current >= targets.listening); break;
      case 'english_grammar': done = (study.english.items.grammar.current >= targets.grammar); break;
      case 'fashion': done = study.fashion.history.some(h => h.date === today); break;
      case 'interview': done = study.interview.history.some(h => h.date === today); break;
      case 'brand': done = (study.brand.history || []).some(h => h.date === today); break;
      case 'finance': done = (study.finance.history || []).some(h => h.date === today); break;
      case 'management': done = (study.management.history || []).some(h => h.date === today); break;
    }
    return { ...st, date: today, done, system: true };
  });
}

// 切换系统任务完成状态，并同步到自我提升
function toggleSystemTask(type, done) {
  const study = DB.get('STUDY');
  const today = DB.today();
  const targets = getDailyTargets();
  switch (type) {
    case 'english_words':
      study.english.items.words.current = done ? targets.words : 0;
      break;
    case 'english_listening':
      study.english.items.listening.current = done ? targets.listening : 0;
      break;
    case 'english_grammar':
      study.english.items.grammar.current = done ? targets.grammar : 0;
      break;
    case 'fashion':
      if (done) {
        if (!study.fashion.history.some(h => h.date === today)) {
          study.fashion.history.push({ date: today, text: '今日穿搭/美妆灵感记录', createdAt: Date.now() });
        }
      } else {
        study.fashion.history = study.fashion.history.filter(h => h.date !== today);
      }
      break;
    case 'interview':
      if (done) {
        if (!study.interview.history.some(h => h.date === today)) {
          study.interview.history.push({ date: today, text: '今日访谈金句记录', createdAt: Date.now() });
        }
      } else {
        study.interview.history = study.interview.history.filter(h => h.date !== today);
      }
      break;
    case 'brand':
      if (done) {
        if (!(study.brand.history || []).some(h => h.date === today)) {
          study.brand.history = study.brand.history || [];
          study.brand.history.push({ date: today, text: '今日品牌认知学习', createdAt: Date.now() });
        }
      } else {

    case 'finance':

          study.finance.history.push({ date: today, text: '今日金融知识学习', createdAt: Date.now() });

// 数组洗牌
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 每日自动更新视频：今天还没更新过就自动补足各分类至少3条
function autoUpdateDailyVideos() {
  const today = DB.today();
  const lastUpdate = DB.get('VIDEO_LAST_UPDATE', '');
  if (lastUpdate === today) return; // 今天已更新过

  let videos = DB.get('VIDEOS', []);
  let updated = false;

  // 检查美妆穿搭：至少3条
  const fashionCount = videos.filter(v =>
    v.category === '美妆穿搭' || (v.tags || []).some(t => /穿搭|美妆|化妆|时尚/.test(t))
  ).length;
  if (fashionCount < 3) {
    const need = 3 - fashionCount;
    const items = generateFashionVideos([], need);
    items.forEach(v => {
      v.id = DB.uid();
      v.date = today;
      v.category = '美妆穿搭';
      v.tags = ['美妆', '穿搭'];
    });
    videos.unshift(...items);
    updated = true;
  }

  // 检查深度访谈：至少3条
  const interviewCount = videos.filter(v =>
    v.category === '深度访谈' || (v.tags || []).some(t => /访谈|人物|哲学/.test(t))
  ).length;
  if (interviewCount < 3) {
    const need = 3 - interviewCount;
    const items = generateInterviewVideos([], need);
    items.forEach(v => {
      v.id = DB.uid();
      v.date = today;
      v.category = '深度访谈';
      v.tags = ['访谈', '人物'];
    });
    videos.unshift(...items);
    updated = true;
  }

  if (updated) {
    DB.set('VIDEOS', videos);
  }
  DB.set('VIDEO_LAST_UPDATE', today);
}

// ===== 每日推荐：品牌认知（排除已看，优先未看） =====
function getDailyBrandVids() {
  const today = DB.today();
  const watched = DB.get('VIDEO_WATCHED', {});
  const watchedKeys = new Set(Object.keys(watched).filter(k => !!watched[k]));
  const lastRecommend = DB.get('BRAND_DAILY_RECOMMEND', {});
  const bloggers = getStudyBloggers('brand');

  // 构建候选池：内置视频 + 用户博主
  let pool = BRAND_VIDEOS.map(v => ({ ...v }));
  bloggers.forEach(b => {
    pool.push({
      title: `${b.name}：${b.note || '关注博主获取最新内容'}`,
      url: b.url, author: b.name, platform: b.platform || '抖音',
      desc: b.note || '', stage: 0,
    });
  });

  // 排除已看过的
  const unseen = pool.filter(v => !watchedKeys.has(v.url));

  // 如果未看视频不够3条，把已看的也加回来（但排在后面）
  let candidates;
  if (unseen.length >= 3) {
    candidates = [...shuffle(unseen)];
  } else {
    const seen = pool.filter(v => watchedKeys.has(v.url));
    candidates = [...shuffle(unseen), ...shuffle(seen)];
  }

  // 优先推荐上次没推荐过的
  const lastKeys = new Set(Object.keys(lastRecommend).filter(k => lastRecommend[k] === today));
  const fresh = candidates.filter(v => !lastKeys.has(v.url));
  const repeated = candidates.filter(v => lastKeys.has(v.url));
  const sorted = [...fresh, ...repeated];

  // 取3条，记录今天推荐了哪些
  const result = sorted.slice(0, 3);
  result.forEach(v => { lastRecommend[v.url] = today; });
  DB.set('BRAND_DAILY_RECOMMEND', lastRecommend);

  return result;
}

  const fresh = candidates.filter(v => !lastKeys.has(v.url));
  const repeated = candidates.filter(v => lastKeys.has(v.url));
  const sorted = [...fresh, ...repeated];

  const result = sorted.slice(0, 3);
  result.forEach(v => { lastRecommend[v.url] = today; });
  DB.set('FINANCE_DAILY_RECOMMEND', lastRecommend);

  return result;
}

function getDailyManagementVids() {
  const today = DB.today();
  const watched = DB.get('VIDEO_WATCHED', {});
  const watchedKeys = new Set(Object.keys(watched).filter(k => !!watched[k]));
  const lastRecommend = DB.get('MANAGEMENT_DAILY_RECOMMEND', {});
  const bloggers = getStudyBloggers('management');

  let pool = MANAGEMENT_VIDEOS.map(v => ({ ...v }));
  bloggers.forEach(b => {
    pool.push({
      title: `${b.name}：${b.note || '关注博主获取最新内容'}`,
      url: b.url, author: b.name, platform: b.platform || '抖音',
      desc: b.note || '', stage: 0,
    });
  });

  const unseen = pool.filter(v => !watchedKeys.has(v.url));
  let candidates;
  if (unseen.length >= 3) {
    candidates = [...shuffle(unseen)];
  } else {
    const seen = pool.filter(v => watchedKeys.has(v.url));
    candidates = [...shuffle(unseen), ...shuffle(seen)];
  }

  const lastKeys = new Set(Object.keys(lastRecommend).filter(k => lastRecommend[k] === today));
  const fresh = candidates.filter(v => !lastKeys.has(v.url));
  const repeated = candidates.filter(v => lastKeys.has(v.url));
  const sorted = [...fresh, ...repeated];

  const result = sorted.slice(0, 3);
  result.forEach(v => { lastRecommend[v.url] = today; });
  DB.set('MANAGEMENT_DAILY_RECOMMEND', lastRecommend);

  return result;
}

function platformEmoji(p) {
  if (!p) return '📺';
  if (p.includes('抖音')) return '🎵';
  if (p.includes('小红书')) return '📕';
  if (p.includes('快手')) return '🎬';
  if (p.includes('微信') || p.includes('视频号')) return '💚';

  return '📱';
}

function fileHtml(f) {
  const ext = (f.name || '').split('.').pop()?.toLowerCase() || '';
  const icon = ['pdf'].includes(ext) ? '📄' : ['doc','docx'].includes(ext) ? '📝' :
    ['xls','xlsx'].includes(ext) ? '📊' : ['ppt','pptx'].includes(ext) ? '🎯' :
    ['jpg','jpeg','png','gif','webp'].includes(ext) ? '🖼️' :
    f.type === 'folder' ? '📁' : f.source === 'api' ? '☁️' : '📎';
  const viewBtn = f.data ? '<button class="btn btn-outline btn-sm" data-file-action="view">查看</button>' :
    f.url ? `<a class="btn btn-outline btn-sm" href="${escapeHtml(f.url)}" target="_blank">打开</a>` : '';
  const downloadBtn = f.data ? '<button class="btn btn-outline btn-sm" data-file-action="download">下载</button>' : '';
  return `<div class="file-item" data-id="${f.id}">
    <div class="file-icon">${icon}</div>
    <div class="file-info">
      <div class="file-name">${escapeHtml(f.name || '未命名')}</div>
      <div class="file-meta">${formatSize(f.size || 0)} · ${f.date || ''} ${f.source === 'api' ? '· 飞书同步' : ''}</div>
    </div>
    <div class="file-actions">
      ${viewBtn}
      ${downloadBtn}
      <button class="btn btn-ghost btn-sm" data-file-action="del">×</button>
    </div>
  </div>`;
}

function formatSize(b) {
  if (!b || b <= 0) return '未知大小';
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  return (b/1024/1024).toFixed(2) + 'MB';
}

function feishuLinkHtml(l) {
  return `<div class="file-item" data-link-id="${l.id}">
    <div class="file-icon">🔗</div>

async function syncFeishu() {
  const config = DB.get('FEISHU_CONFIG', {});
  if (!config.appId || !config.appSecret) {
    toast('⚠️ 请先配置飞书 API（点"⚙️ API 配置"）');
    return;
  }
  toast('⏳ 正在同步飞书文件...');
  try {
    // 获取 tenant_access_token
    const tokenResp = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app_id: config.appId, app_secret: config.appSecret })
    });
    const tokenData = await tokenResp.json();
    if (tokenData.code !== 0) {
      toast(`❌ 认证失败: ${tokenData.msg}`);
      return;
    }
    const accessToken = tokenData.tenant_access_token;

    // 尝试多种方式拉取文件
    let files = [];

    // 方式1: 如果有 folder token，尝试文件夹列表
    if (config.folderToken) {
      const folderResp = await fetch(`https://open.feishu.cn/open-apis/drive/v1/files?folder_token=${config.folderToken}&page_size=20`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const folderData = await folderResp.json();
      if (folderData.code === 0) {
        files = (folderData.data?.files || []).map(f => ({
          name: f.name,
          type: f.type,
          token: f.token,
          size: f.size || 0,
          url: f.url || '',
          source: 'api',
        }));
      }
    }

    // 方式2: 如果没有 folder token 或拉取失败，尝试知识库
    if (files.length === 0 && config.folderToken) {
      const wikiResp = await fetch(`https://open.feishu.cn/open-apis/wiki/v2/spaces/get_node?token=${config.folderToken}`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const wikiData = await wikiResp.json();
      if (wikiData.code === 0) {
        const node = wikiData.data?.node || {};
        files = [{
          name: node.title || '知识库文档',
          type: node.obj_type || 'wiki',
          token: config.folderToken,
          size: 0,
          url: node.url || '',
          source: 'api',
        }];
        // 如果有子节点
        if (node.children) {
          files = files.concat(node.children.map(c => ({
            name: c.title || '子文档',
            type: c.obj_type || 'doc',
            token: c.token || c.obj_token,
            size: 0,
            url: c.url || '',
            source: 'api',
          })));
        }
      }
    }

    if (files.length === 0) {
      toast('⚠️ 未找到文件。请确认：\n1. 权限已开通（drive:drive:readonly + wiki:wiki:readonly）\n2. 应用已被添加为文档协作者\n3. Token 类型正确');
      return;
    }

    // 保存到本地
    const existing = DB.get('FILES', []);
    files.forEach(f => {
      if (!existing.find(e => e.token === f.token)) {
        existing.unshift({
          id: DB.uid(),
          name: f.name,
          size: f.size,
          type: f.type === 'folder' ? 'folder' : f.type === 'sheet' ? 'application/vnd.ms-excel' : f.type === 'docx' ? 'application/msword' : 'application/octet-stream',
          token: f.token,
          url: f.url,
          source: f.source,
          date: DB.today(),
          data: null, // API 拉取的不存 base64
        });
      }
    });
    DB.set('FILES', existing);
    toast(`✅ 同步完成，新增 ${files.length} 个文件`);
    App.renderTab();
  } catch (e) {
    toast(`❌ 同步失败: ${e.message}`);
  }
}

function handleFileUpload(e) {
  const files = [...e.target.files];
  const max = 10 * 1024 * 1024;
  const valid = files.filter(f => f.size <= max);
  if (valid.length < files.length) {
    toast(`已跳过 ${files.length - valid.length} 个超大文件（>10MB）`);
  }
  if (!valid.length) return;
  let count = 0;
  valid.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const items = DB.get('FILES', []);
      items.unshift({
        id: DB.uid(),
        name: file.name,
        size: file.size,
        type: file.type,
        data: reader.result,
        date: DB.today(),
      });
      DB.set('FILES', items);
      count++;
      if (count === valid.length) {
        toast(`✓ 已上传 ${count} 个文件`);
        App.renderTab();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function downloadFile(dataUrl, name) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.click();
}

          <div class="mini-stat"><span class="mini-label">播放</span><span class="mini-val">${fmtNum(pd.views)}</span></div>
          <div class="mini-stat"><span class="mini-label">获赞</span><span class="mini-val">${fmtNum(pd.likes)}</span></div>
          <div class="mini-stat"><span class="mini-label">发布</span><span class="mini-val">${pd.videos || 0}</span></div>
        </div>
      </div>`;
  });

  // 历史趋势（简单柱状图）
  const recentHistory = history.slice(-7);
  let trendHtml = '';

    const maxFollowers = Math.max(...recentHistory.map(h => calcTotals([h], platforms).followers), 1);

      <div class="card mt-2">
        <div class="card-header">
          <div class="card-title">📈 粉丝趋势（最近7次）</div>
        </div>
        <div class="trend-bars">

            return `<div class="trend-bar-item" title="${h.date}: ${fmtNum(t.followers)}">
              <div class="trend-bar" style="height:${Math.max(pct, 5)}%"><span class="trend-val">${fmtNum(t.followers)}</span></div>

              <span>❤️ ${fmtNum(t.likes)}</span>
              <span>🎬 ${t.videos}</span>

    <div class="empty-icon">📊</div>

  });
}

function getAccountData() {
  return DB.get('ACCOUNT_DATA', { history: [] });
}

function calcTotals(history, platforms) {
  const totals = { followers: 0, views: 0, likes: 0, videos: 0 };
  if (!history.length) return totals;
  const latest = history[history.length - 1];
  if (!latest?.platforms) return totals;
  platforms.forEach(p => {
    const pd = latest.platforms[p] || {};
    totals.followers += pd.followers || 0;
    totals.views += pd.views || 0;
    totals.likes += pd.likes || 0;
    totals.videos += pd.videos || 0;
  });
  return totals;
}

function calcChange(prev, curr) {
  const platforms = ['抖音', '小红书', 'B站', '视频号'];
  const change = { followers: 0, views: 0, likes: 0, videos: 0 };
  platforms.forEach(p => {
    const pp = prev.platforms?.[p] || {};
    const cp = curr.platforms?.[p] || {};
    change.followers += (cp.followers || 0) - (pp.followers || 0);
    change.views += (cp.views || 0) - (pp.views || 0);
    change.likes += (cp.likes || 0) - (pp.likes || 0);
    change.videos += (cp.videos || 0) - (pp.videos || 0);
  });
  return change;
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '0';
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

    study.management = study.management || {};
    study.management.stage = stage;
    study.management.manualStage = true;
  }
  DB.set('STUDY', study);
  const names = ['基础认知', '进阶实战', '深入分析'];
  toast(`✓ 已切换到「${names[stage] || '基础认知'}」阶段`);
  App.renderTab();
}

}

function manageStudyBloggers(type) {
  const labels = { brand: '品牌认知', finance: '金融知识', management: '管理知识' };
  const label = labels[type] || '管理知识';
  const videoConsts = { brand: BRAND_VIDEOS, finance: FINANCE_VIDEOS, management: MANAGEMENT_VIDEOS };
  const bloggers = getStudyBloggers(type);
  // 同时显示内置视频中的抖音博主
  const builtIn = (videoConsts[type] || MANAGEMENT_VIDEOS)
    .filter(v => v.platform === '抖音')
    .map(v => ({ id: v.author, name: v.author, platform: '抖音', url: v.url, note: v.desc, builtIn: true }));

  const allBloggers = [...bloggers, ...builtIn.filter(b => !bloggers.some(ub => ub.name === b.name))];

  Modal.open(`👤 ${label} - 博主管理`, `
    <div style="max-height:55vh;overflow-y:auto;">
      ${allBloggers.length === 0 ? '<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-text">还没有添加博主</div></div>' : ''}
      ${allBloggers.map(b => `
        <div class="card" style="margin-bottom:6px;${b.builtIn ? 'border-left:3px solid #3498db;' : ''}">
          <div class="card-header">
            <div>
              <div class="card-title" style="font-size:14px;">${escapeHtml(b.name)} ${b.builtIn ? '<span style="font-size:11px;color:#3498db;">[内置]</span>' : ''}</div>
              <div class="card-sub">${escapeHtml(b.platform || '抖音')} · ${escapeHtml((b.note || '').slice(0, 30))}</div>
            </div>
            <div>
              ${b.url ? `<a class="btn btn-primary btn-sm" href="${escapeHtml(b.url)}" target="_blank">▶️ 主页</a>` : ''}
              ${!b.builtIn ? `<button class="btn btn-ghost btn-sm" data-blogger-del="${b.id}">×</button>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    <hr style="margin:12px 0;border-color:var(--border);">
    <div style="font-size:13px;color:var(--muted);">➕ 添加新博主（输入抖音号/昵称和主页链接）：</div>
    <div class="form-group">
      <input class="form-input" id="newBloggerName" placeholder="博主昵称">
    </div>
    <div class="form-group">
      <select class="form-input" id="newBloggerPlatform">
        <option value="抖音">抖音</option>
        <option value="B站">B站</option>
        <option value="小红书">小红书</option>
      </select>
    </div>
    <div class="form-group">
      <input class="form-input" id="newBloggerUrl" placeholder="主页链接（必填）">
    </div>
    <div class="form-group">
      <input class="form-input" id="newBloggerNote" placeholder="备注（可选）：这个博主讲什么？">
    </div>
    <div class="flex gap-1" style="justify-content:flex-end;">
      <button class="btn btn-outline" onclick="Modal.close()">关闭</button>
      <button class="btn btn-primary" id="addBloggerBtn">添加</button>
    </div>
  `);

  // 删除博主
  document.querySelectorAll('[data-blogger-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.bloggerDel;
      const list = getStudyBloggers(type).filter(b => b.id !== id);
      saveStudyBloggers(type, list);
      manageStudyBloggers(type);
    });
  });

  // 添加博主
  document.getElementById('addBloggerBtn')?.addEventListener('click', () => {
    const name = document.getElementById('newBloggerName').value.trim();
    const platform = document.getElementById('newBloggerPlatform').value;
    const url = document.getElementById('newBloggerUrl').value.trim();
    const note = document.getElementById('newBloggerNote').value.trim();
    if (!name) { toast('请输入博主昵称'); return; }
    if (!url) { toast('请输入主页链接'); return; }
    const list = getStudyBloggers(type);
    list.push({ id: DB.uid(), name, platform, url, note, addedAt: DB.today() });
    saveStudyBloggers(type, list);
    toast(`✓ 已添加「${name}」`);
    manageStudyBloggers(type);
  });
}

// ===== 模块：设置 =====
function renderSettings() {
  return `
    <div class="card">
      <div class="card-header"><div class="card-title">💾 数据管理</div></div>
      <div class="flex gap-1" style="flex-wrap:wrap;">
        <button class="btn btn-outline" id="copyDataBtn">📋 一键复制数据</button>
        <button class="btn btn-outline" id="exportDataBtn">📤 导出JSON文件</button>
        <label class="btn btn-outline">
          📥 导入数据
          <input type="file" id="importInput" accept=".json" style="display:none;">
        </label>
        <button class="btn btn-outline" id="resetDataBtn" style="color:var(--danger);">🗑️ 清空所有数据</button>
      </div>
      <div class="text-soft mt-2" style="font-size:12px;">所有数据保存在你的浏览器本地。优化时点击「📋 一键复制」粘贴给AI即可精准修改。</div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">📱 安装为应用</div></div>
      <div class="text-soft" style="font-size:13px;line-height:1.7;">
        浏览器右上角 → 选择"安装凤梨学习台"或"添加到主屏幕"，即可像 App 一样使用
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">ℹ️ 关于</div></div>
      <div class="text-soft" style="font-size:13px;line-height:1.7;">
        <p>凤梨学习台 v1.0</p>
        <p>凤梨的成长学习台</p>
        <p>学习记录永久保存，数据可随时导出备份</p>
      </div>
    </div>
  `;
}

function bindSettingsEvents() {
  document.getElementById('exportDataBtn')?.addEventListener('click', () => {
    const data = {};
    Object.values(DB.KEYS).forEach(k => data[k] = localStorage.getItem(k));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `凤梨学习台_备份_${DB.today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('✓ 备份已下载');
  });
  document.getElementById('copyDataBtn')?.addEventListener('click', async () => {
    const data = {};
    Object.values(DB.KEYS).forEach(k => data[k] = localStorage.getItem(k));
    const text = JSON.stringify(data, null, 2);
    try {
      await navigator.clipboard.writeText(text);
      toast('✓ 数据已复制到剪贴板，粘贴给AI即可');
    } catch {
      // fallback: 选中文本手动复制
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('✓ 数据已复制');
    }
  });
  document.getElementById('importInput')?.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, v));
        toast('✓ 数据已导入');
        setTimeout(() => location.reload(), 800);
      } catch (e) {
        toast('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
  });
  document.getElementById('resetDataBtn')?.addEventListener('click', () => {
    if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
    if (!confirm('再次确认：所有任务、视频、文件等数据都将被清空')) return;
    Object.values(DB.KEYS).forEach(k => localStorage.removeItem(k));
    toast('已清空');
    setTimeout(() => location.reload(), 600);
  });
}

// ===== 工具函数 =====
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ===== 启动 =====
document.addEventListener('DOMContentLoaded', () => App.init());

// 注册 Service Worker (PWA)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
